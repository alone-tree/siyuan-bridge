<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>思源桥 · 遥测看板</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f6fa;
      color: #2d3436;
      min-height: 100vh;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 24px 32px;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    }
    .header h1 { font-size: 22px; font-weight: 600; }
    .header p { font-size: 13px; opacity: .85; margin-top: 4px; }
    .header select {
      padding: 8px 14px; border-radius: 8px; border: none; font-size: 14px;
      background: rgba(255,255,255,.15); color: #fff; cursor: pointer;
    }
    .header select option { color: #2d3436; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card {
      background: #fff; border-radius: 12px; padding: 20px 24px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .card .label { font-size: 13px; color: #636e72; margin-bottom: 8px; }
    .card .value { font-size: 28px; font-weight: 700; color: #2d3436; }
    .card .value.success { color: #00b894; }
    .card .sub { font-size: 12px; color: #b2bec3; margin-top: 4px; }
    .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    @media (max-width: 768px) { .charts { grid-template-columns: 1fr; } }
    .panel {
      background: #fff; border-radius: 12px; padding: 20px 24px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .panel h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; color: #2d3436; }
    .chart-wrap { position: relative; width: 100%; }
    .chart-wrap canvas { width: 100% !important; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 8px 12px; border-bottom: 2px solid #dfe6e9; color: #636e72; font-weight: 600; }
    td { padding: 8px 12px; border-bottom: 1px solid #f1f2f6; }
    tr:hover td { background: #f8f9fd; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .badge-ok { background: #00b8941a; color: #00b894; }
    .badge-err { background: #ff76751a; color: #d63031; }
    .badge-type { background: #dfe6e9; color: #636e72; }
    .footer { text-align: center; padding: 24px; font-size: 12px; color: #b2bec3; }
    .loading { text-align: center; padding: 60px 0; color: #b2bec3; }
    .error-banner { background: #fff5f5; color: #d63031; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; font-size: 13px; display: none; }
    .empty { text-align: center; padding: 40px 0; color: #b2bec3; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>思源桥 · 遥测看板</h1>
      <p>SiYuan Bridge Telemetry Dashboard</p>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <span style="font-size:13px;">时间窗口</span>
      <select id="daysSelect">
        <option value="7">最近 7 天</option>
        <option value="14">最近 14 天</option>
        <option value="30" selected>最近 30 天</option>
        <option value="90">最近 90 天</option>
        <option value="365">最近一年</option>
      </select>
    </div>
  </div>

  <div class="container">
    <div class="error-banner" id="errorBanner"></div>

    <div class="cards">
      <div class="card"><div class="label">活跃用户</div><div class="value" id="vUsers">—</div><div class="sub">独立匿名设备数</div></div>
      <div class="card"><div class="label">总调用次数</div><div class="value" id="vCalls">—</div><div class="sub" id="subCalls"></div></div>
      <div class="card"><div class="label">成功率</div><div class="value success" id="vRate">—</div><div class="sub" id="subRate"></div></div>
      <div class="card"><div class="label">平均耗时</div><div class="value" id="vDur">—</div><div class="sub">毫秒 / 次</div></div>
    </div>

    <div class="charts">
      <div class="panel">
        <h3>每日调用量</h3>
        <div class="chart-wrap"><canvas id="chartCalls"></canvas></div>
      </div>
      <div class="panel">
        <h3>每日成功率</h3>
        <div class="chart-wrap"><canvas id="chartRate"></canvas></div>
      </div>
    </div>

    <div class="charts" style="margin-bottom:24px;">
      <div class="panel">
        <h3>各工具调用分布</h3>
        <div class="chart-wrap"><canvas id="chartToolCalls" style="max-height:300px;"></canvas></div>
      </div>
      <div class="panel">
        <h3>各工具成功率</h3>
        <div class="chart-wrap"><canvas id="chartToolRate" style="max-height:300px;"></canvas></div>
      </div>
    </div>

    <div class="charts">
      <div class="panel">
        <h3>工具详情</h3>
        <div id="toolTable"></div>
      </div>
      <div class="panel">
        <h3>失败类型 Top 20</h3>
        <div id="errorTable"></div>
      </div>
    </div>

    <div class="footer">
      思源桥遥测看板 · 数据来自 <span id="endpointDisplay">—</span> · 每 5 分钟自动刷新
    </div>
  </div>

  <script>
    var API_BASE = new URLSearchParams(window.location.search).get('endpoint') ||
      'https://siyuanbridgetelemetry.zingerplayground.top';
    document.getElementById('endpointDisplay').textContent = API_BASE;

    var charts = {};

    function destroyChart(key) {
      if (charts[key]) { charts[key].destroy(); delete charts[key]; }
    }

    async function fetchDashboard(days) {
      var res = await fetch(API_BASE + '/api/dashboard?days=' + days);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }

    function renderSummary(data) {
      var s = data.summary || {};
      document.getElementById('vUsers').textContent = s.active_users != null ? s.active_users : '—';
      document.getElementById('vCalls').textContent = (s.total_calls || 0).toLocaleString();
      document.getElementById('vRate').textContent = s.success_rate != null ? s.success_rate + '%' : '—';
      document.getElementById('vDur').textContent = s.avg_dur_ms != null ? s.avg_dur_ms + ' ms' : '—';
      document.getElementById('subCalls').textContent = '近 ' + data.days + ' 天累计';
      document.getElementById('subRate').textContent = '目标 ≥ 95%';
    }

    function renderDailyCalls(daily) {
      destroyChart('calls');
      if (!daily || daily.length === 0) return;
      var ctx = document.getElementById('chartCalls').getContext('2d');
      charts.calls = new Chart(ctx, {
        type: 'line',
        data: {
          labels: daily.map(function(d) { return d.date; }),
          datasets: [{
            label: '调用次数',
            data: daily.map(function(d) { return d.calls; }),
            borderColor: '#667eea',
            backgroundColor: '#667eea1a',
            fill: true,
            tension: 0.3,
            pointRadius: 2,
            pointHoverRadius: 5,
          }],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { font: { size: 11 } } },
            y: { beginAtZero: true, ticks: { font: { size: 11 } } },
          },
        },
      });
    }

    function renderDailyRate(daily) {
      destroyChart('rate');
      if (!daily || daily.length === 0) return;
      var ctx = document.getElementById('chartRate').getContext('2d');
      charts.rate = new Chart(ctx, {
        type: 'line',
        data: {
          labels: daily.map(function(d) { return d.date; }),
          datasets: [{
            label: '成功率 %',
            data: daily.map(function(d) { return d.success_rate; }),
            borderColor: '#00b894',
            backgroundColor: '#00b8941a',
            fill: true,
            tension: 0.3,
            pointRadius: 2,
            pointHoverRadius: 5,
          }],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { font: { size: 11 } } },
            y: { min: 0, max: 100, ticks: { font: { size: 11 }, callback: function(v) { return v + '%'; } } },
          },
        },
      });
    }

    function renderToolBar(byTool) {
      destroyChart('toolCalls');
      destroyChart('toolRate');
      if (!byTool || byTool.length === 0) return;

      var colors = ['#667eea','#764ba2','#00b894','#fdcb6e','#e17055','#6c5ce7','#fd79a8','#00cec9'];

      var ctx1 = document.getElementById('chartToolCalls').getContext('2d');
      charts.toolCalls = new Chart(ctx1, {
        type: 'bar',
        data: {
          labels: byTool.map(function(t) { return t.tool.replace('siyuan_',''); }),
          datasets: [{
            label: '调用次数',
            data: byTool.map(function(t) { return t.calls; }),
            backgroundColor: byTool.map(function(_, i) { return colors[i % colors.length]; }),
          }],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { font: { size: 10 } } },
            y: { beginAtZero: true, ticks: { font: { size: 11 } } },
          },
        },
      });

      var ctx2 = document.getElementById('chartToolRate').getContext('2d');
      charts.toolRate = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: byTool.map(function(t) { return t.tool.replace('siyuan_',''); }),
          datasets: [{
            label: '成功率 %',
            data: byTool.map(function(t) { return t.success_rate; }),
            backgroundColor: byTool.map(function(t) {
              return t.success_rate >= 95 ? '#00b894' : t.success_rate >= 80 ? '#fdcb6e' : '#e17055';
            }),
          }],
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { font: { size: 10 } } },
            y: { min: 0, max: 100, ticks: { font: { size: 11 }, callback: function(v) { return v + '%'; } } },
          },
        },
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderToolTable(byTool) {
      var el = document.getElementById('toolTable');
      if (!byTool || byTool.length === 0) { el.innerHTML = '<div class="empty">暂无数据</div>'; return; }
      var rows = '';
      for (var i = 0; i < byTool.length; i++) {
        var t = byTool[i];
        var cls = t.success_rate >= 95 ? 'badge-ok' : 'badge-err';
        rows += '<tr>' +
          '<td><code>' + escapeHtml(t.tool) + '</code></td>' +
          '<td>' + t.calls.toLocaleString() + '</td>' +
          '<td><span class="badge ' + cls + '">' + t.success_rate + '%</span></td>' +
          '<td>' + (t.avg_dur_ms != null ? t.avg_dur_ms + ' ms' : '—') + '</td>' +
          '</tr>';
      }
      el.innerHTML = '<table>' +
        '<thead><tr><th>工具</th><th>调用次数</th><th>成功率</th><th>平均耗时</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>';
    }

    function renderErrorTable(byError) {
      var el = document.getElementById('errorTable');
      if (!byError || byError.length === 0) { el.innerHTML = '<div class="empty">暂无错误记录 ' + '🎉' + '</div>'; return; }
      var rows = '';
      for (var i = 0; i < byError.length; i++) {
        var e = byError[i];
        rows += '<tr>' +
          '<td><span class="badge badge-type">' + escapeHtml(e.error_type) + '</span></td>' +
          '<td>' + e.count.toLocaleString() + '</td>' +
          '</tr>';
      }
      el.innerHTML = '<table>' +
        '<thead><tr><th>错误类型</th><th>次数</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>';
    }

    async function load() {
      var days = document.getElementById('daysSelect').value;
      var banner = document.getElementById('errorBanner');
      banner.style.display = 'none';

      try {
        var data = await fetchDashboard(days);
        renderSummary(data);
        renderDailyCalls(data.daily);
        renderDailyRate(data.daily);
        renderToolBar(data.by_tool);
        renderToolTable(data.by_tool);
        renderErrorTable(data.by_error);
      } catch (e) {
        banner.textContent = '无法加载遥测数据：' + e.message + '。请检查 API 端点是否可访问。';
        banner.style.display = 'block';
      }
    }

    document.getElementById('daysSelect').addEventListener('change', load);
    load();
    setInterval(load, 300000);
  </script>
</body>
</html>
